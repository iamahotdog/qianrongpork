<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>千容肉品｜團購訂購</title>
<style>
:root{
  --cream:#fffaf2; --paper:#fffdf9; --olive:#8f9060; --brown:#4a2b1d;
  --coral:#ef8065; --line:#eadfce; --muted:#7a6b61; --soft:#f8f0e6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--brown);font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.site-nav{position:sticky;top:0;z-index:30;background:rgba(255,253,249,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.site-nav-inner{max-width:1180px;margin:auto;height:68px;padding:8px 18px;display:flex;align-items:center;justify-content:space-between}
.site-logo{height:48px;width:auto;object-fit:contain}
.site-note{font-size:14px;color:var(--muted);letter-spacing:.04em}
.page{display:none;min-height:100vh}
.page.active{display:block}
.hero img{width:100%;height:auto}
.wrap{max-width:980px;margin:auto;padding:18px 14px 110px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(74,43,29,.05)}
.welcome{margin-bottom:18px;background:linear-gradient(180deg,#fffdf9 0%,#fff8f0 100%);border:1px solid var(--line);border-radius:22px;padding:22px}
.eyebrow{font-size:14px;color:var(--olive);font-weight:800;letter-spacing:.08em;margin-bottom:8px}
.welcome h1{margin:0 0 12px;font-size:30px;line-height:1.35}
.welcome p{margin:0;line-height:1.9;color:var(--muted)}
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.guide-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
.guide-card h3{margin:0 0 8px;font-size:19px}
.guide-card img{width:100%;border-radius:12px;max-height:310px;object-fit:contain}
.next-wrap{text-align:center;margin-top:18px}
.primary{border:0;background:var(--coral);color:#fff;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:800}
.secondary{border:1px solid var(--olive);background:#fff;color:var(--olive);border-radius:14px;padding:13px 18px;font-size:16px;font-weight:800}
.topbar{position:sticky;top:68px;z-index:20;background:rgba(255,250,242,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:980px;margin:auto;padding:12px 14px;display:grid;grid-template-columns:150px 1fr 150px;align-items:center}
.topbar h1{margin:0;text-align:center;font-size:22px}
.section-title{margin:4px 0 14px}.section-title h2{margin:0;font-size:26px}.section-title p{margin:6px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(74,43,29,.05)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover}
.card-body{padding:12px}
.name{font-size:18px;font-weight:800}.meta{font-size:13px;color:var(--muted);margin-top:4px}
.control{display:flex;align-items:center;justify-content:space-between;margin-top:12px;background:var(--soft);border-radius:12px;padding:7px}
.control button{width:38px;height:38px;border:0;border-radius:10px;background:white;color:var(--brown);font-size:22px;font-weight:800}
.qty{font-size:19px;font-weight:800}.subtotal{text-align:right;margin-top:8px;font-weight:700;font-size:14px}
.shop-summary{position:sticky;bottom:0;background:rgba(255,253,249,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));margin:18px -14px -110px}
.shop-summary-inner{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px}
.shop-summary .amount{flex:1}.amount small{display:block;color:var(--muted)}.amount strong{font-size:23px}
.checkout-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
.order-card,.form-card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px}
.order-card h2,.form-card h2{margin:0 0 14px}
.item-list{display:flex;flex-direction:column;gap:10px}
.line-item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee3d5}
.line-item:last-child{border-bottom:0}
.line-item img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.item-main strong{display:block}.item-main small{color:var(--muted)}
.item-price{text-align:right;font-weight:800}
.price-block{margin-top:14px;background:var(--soft);border-radius:16px;padding:14px}
.price-row{display:flex;justify-content:space-between;gap:16px;margin:8px 0}
.price-row.total{padding-top:10px;border-top:1px solid #dccdbb;font-size:19px;font-weight:800}
.shipping-note{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff7ef;border:1px solid #f0d7c8;line-height:1.6;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field.full{grid-column:1/-1}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:14px}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #d8c8b4;border-radius:10px;background:#fffdf9;font-size:15px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(143,144,96,.12)}
.field textarea{min-height:74px;resize:vertical}
.helper{font-size:12px;color:var(--muted);margin-top:5px}
.checkout-actions{display:flex;gap:10px;margin-top:16px}
.checkout-actions button{flex:1}
.done{display:none;margin-top:14px;padding:14px;background:#f2f5e8;border:1px solid #d9dfbf;border-radius:14px;line-height:1.7}
@media(max-width:760px){
  .site-nav-inner{height:58px;padding:6px 12px}.site-logo{height:40px}.site-note{display:none}
  .topbar{top:58px}.topbar-inner{grid-template-columns:110px 1fr 110px;padding:10px}
  .topbar h1{font-size:19px}
  .welcome{padding:18px}.welcome h1{font-size:24px}
  .wrap{padding:10px 10px 90px}
  .panel{padding:12px}
  .guide-grid{grid-template-columns:1fr}
  .guide-card img{max-height:230px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card-body{padding:9px}.name{font-size:16px}.meta{font-size:12px}
  .control button{width:34px;height:34px}.qty{font-size:17px}
  .checkout-layout{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .order-card,.form-card{padding:14px}
  .shop-summary{margin:18px -10px -90px}
}
@media(max-width:380px){
  .topbar-inner{grid-template-columns:94px 1fr 94px}
  .secondary{padding:10px 12px;font-size:14px}
  .grid{gap:6px}.card-body{padding:8px}.name{font-size:15px}
  .control{padding:5px}.control button{width:30px;height:30px;font-size:20px}
}
</style>
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <img class="site-logo" src="assets/logo-horizontal.png" alt="千容肉品">
    <div class="site-note">屏東東港・新鮮直送</div>
  </div>
</nav>

<section id="pageIntro" class="page active">
  <header class="hero"><img src="assets/header.png" alt="千容肉品首頁"></header>
  <main class="wrap">
    <section class="welcome">
      <div class="eyebrow">來自屏東東港的好豬肉</div>
      <h1>歡迎參加千容肉品首次團購</h1>
      <p>我們用心挑選來自屏東的新鮮豬肉，每日新鮮分切、冷凍配送，希望把安心又美味的豬肉送到您的餐桌。</p>
    </section>
    <section class="panel">
      <div class="guide-grid">
        <div class="guide-card"><h3>團購流程</h3><img src="assets/flow.png" alt="團購流程"></div>
        <div class="guide-card"><h3>加入官方LINE</h3><img src="assets/line.png" alt="加入官方LINE"></div>
      </div>
      <div class="next-wrap"><button class="primary" onclick="goPage('pageShop')">下一步：開始選購</button></div>
    </section>
  </main>
</section>

<section id="pageShop" class="page">
  <div class="topbar">
    <div class="topbar-inner">
      <button class="secondary" onclick="goPage('pageIntro')">返回首頁</button>
      <h1>挑選喜歡的豬肉</h1>
      <span></span>
    </div>
  </div>
  <main class="wrap">
    <section id="products" class="grid"></section>
    <div class="shop-summary">
      <div class="shop-summary-inner">
        <div class="amount"><small id="countText">共0包</small><strong id="goodsText">$0</strong></div>
        <button class="primary" onclick="toCheckout()">確認訂單</button>
      </div>
    </div>
  </main>
</section>

<section id="pageCheckout" class="page">
  <div class="topbar">
    <div class="topbar-inner">
      <button class="secondary" onclick="goPage('pageShop')">返回選購</button>
      <h1>訂單確認</h1>
      <span></span>
    </div>
  </div>
  <main class="wrap">
    <div class="checkout-layout">
      <section class="order-card">
        <h2>商品明細</h2>
        <div id="itemList" class="item-list"></div>
        <div class="price-block">
          <div class="price-row"><span>商品小計</span><strong id="goodsAmount">$0</strong></div>
          <div class="price-row"><span>配送費</span><strong id="shippingAmount">$290</strong></div>
          <div class="price-row total"><span>應付總額</span><strong id="grandTotal">$290</strong></div>
        </div>
        <div class="shipping-note">
          冷凍宅配每箱290元；商品滿3,000元免運。選擇臺北市面交則免運。
        </div>
      </section>

      <section class="form-card">
        <h2>訂購人／收件資料</h2>
        <div class="fields">
          <div class="field"><label>訂購人姓名</label><input id="buyerName" placeholder="請輸入姓名"></div>
          <div class="field"><label>聯絡電話</label><input id="phone" inputmode="tel" placeholder="09xxxxxxxx"></div>
          <div class="field full"><label>配送方式</label>
            <select id="shipping" onchange="updateCheckout()">
              <option value="290">黑貓冷凍宅急便（290元）</option>
              <option value="290">7-11冷凍宅配（290元）</option>
              <option value="0">臺北市面交（免運）</option>
            </select>
          </div>
          <div class="field"><label>收件人姓名</label><input id="receiverName" placeholder="若同訂購人可填相同姓名"></div>
          <div class="field"><label>匯款帳號後五碼</label><input id="last5" inputmode="numeric" maxlength="5" placeholder="付款後填寫"></div>
          <div class="field full"><label>收件地址</label><textarea id="address" placeholder="請填寫完整地址；面交可填方便聯繫的地點"></textarea></div>
          <div class="field full"><label>備註</label><textarea id="note" placeholder="例如：希望到貨時段、其他需求"></textarea></div>
        </div>
        <div class="checkout-actions">
          <button class="secondary" onclick="goPage('pageShop')">返回選購</button>
          <button class="primary" onclick="submitOrder()">送出訂單</button>
        </div>
        <div id="done" class="done"></div>
      </section>
    </div>
  </main>
</section>

<script>
const products = [
  {name:'老鼠肉', img:'assets/老鼠肉.png'},
  {name:'里肌肉', img:'assets/里肌肉.png'},
  {name:'梅花肉', img:'assets/梅花肉.png'},
  {name:'豬腳', img:'assets/豬腳.png'},
  {name:'三層肉', img:'assets/三層肉.png'},
  {name:'排骨', img:'assets/排骨.png'}
].map(p=>({...p,price:200,qty:0}));

function goPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function money(n){return '$'+n.toLocaleString('zh-TW')}
function goodsTotal(){return products.reduce((s,p)=>s+p.qty*p.price,0)}
function countTotal(){return products.reduce((s,p)=>s+p.qty,0)}
function renderProducts(){
  document.getElementById('products').innerHTML=products.map((p,i)=>`
    <article class="card">
      <img src="${p.img}" alt="${p.name}">
      <div class="card-body">
        <div class="name">${p.name}</div>
        <div class="meta">每包1斤｜200元</div>
        <div class="control">
          <button onclick="changeQty(${i},-1)">−</button>
          <span class="qty">${p.qty}包</span>
          <button onclick="changeQty(${i},1)">＋</button>
        </div>
        <div class="subtotal">小計：${money(p.qty*p.price)}</div>
      </div>
    </article>`).join('');
  document.getElementById('countText').textContent=`共${countTotal()}包`;
  document.getElementById('goodsText').textContent=money(goodsTotal());
}
function changeQty(i,d){
  products[i].qty=Math.max(0,Math.min(20,products[i].qty+d));
  renderProducts();
}
function shippingFee(){
  const goods=goodsTotal();
  if(goods>=3000) return 0;
  return Number(document.getElementById('shipping')?.value||290);
}
function toCheckout(){
  if(countTotal()===0){alert('請先選擇至少一項商品。');return}
  updateCheckout();
  goPage('pageCheckout');
}
function updateCheckout(){
  const chosen=products.filter(p=>p.qty>0);
  document.getElementById('itemList').innerHTML=chosen.map(p=>`
    <div class="line-item">
      <img src="${p.img}" alt="${p.name}">
      <div class="item-main"><strong>${p.name}</strong><small>${p.qty}包 × 200元</small></div>
      <div class="item-price">${money(p.qty*p.price)}</div>
    </div>`).join('');
  const goods=goodsTotal(), ship=shippingFee(), total=goods+ship;
  document.getElementById('goodsAmount').textContent=money(goods);
  document.getElementById('shippingAmount').textContent=ship===0?'免運':money(ship);
  document.getElementById('grandTotal').textContent=money(total);
}
function submitOrder(){
  const required=[
    ['buyerName','請填寫訂購人姓名'],
    ['phone','請填寫聯絡電話'],
    ['receiverName','請填寫收件人姓名'],
    ['address','請填寫收件地址'],
    ['last5','請填寫匯款帳號後五碼']
  ];
  for(const [id,msg] of required){
    const el=document.getElementById(id);
    if(!el.value.trim()){alert(msg);el.focus();return}
  }
  const items=products.filter(p=>p.qty>0).map(p=>`${p.name}：${p.qty}包`).join('、');
  const goods=goodsTotal(), ship=shippingFee(), total=goods+ship;
  const shipText=document.getElementById('shipping').selectedOptions[0].text;
  window.orderText=`【千容肉品訂單】
商品：${items}
商品金額：${money(goods)}
運費：${ship===0?'免運':money(ship)}
應付總額：${money(total)}

訂購人：${document.getElementById('buyerName').value}
電話：${document.getElementById('phone').value}
配送方式：${shipText}
收件人：${document.getElementById('receiverName').value}
地址：${document.getElementById('address').value}
匯款後五碼：${document.getElementById('last5').value}
備註：${document.getElementById('note').value||'無'}`;
  const done=document.getElementById('done');
  done.style.display='block';
  done.innerHTML='<strong>訂單內容已整理完成。</strong><br>請複製訂單內容並傳送至千容肉品官方LINE，以利對帳與確認。<br><br><button class="primary" onclick="copyOrder()">複製訂單內容</button>';
}
async function copyOrder(){
  try{await navigator.clipboard.writeText(window.orderText);alert('訂單內容已複製，可貼到官方LINE。')}
  catch(e){prompt('請複製以下訂單內容：',window.orderText)}
}
renderProducts();
</script>
</body>
</html>
